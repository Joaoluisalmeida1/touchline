name: PR rules

# Re-runs when the description is edited, so fixing the PR text turns the check green.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  rollback-plan:
    name: Migration PRs have a rollback plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check rollback plan (CONTRIBUTING.md §5)
        env:
          # passed through env, never interpolated into the script (untrusted text)
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/check-pr-rules.mjs
